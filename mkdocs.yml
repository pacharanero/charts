site_name: Marcus Baw Guitar Charts
site_description: A collection of guitar chord and lyric charts in Markdown format
site_author: Marcus Baw
site_url: https://marcusbaw.github.io/guitar-music/

repo_name: marcusbaw/guitar-music
repo_url: https://github.com/marcusbaw/guitar-music
edit_uri: edit/main/

docs_dir: charts

theme:
  variant: classic
  custom_dir: charts/styles/
  palette:
    # Palette toggle for automatic mode
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode

    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: brown
      accent: orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: brown
      accent: orange
      toggle:
        icon: material/brightness-4
        name: Switch to system preference

  features:
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - navigation.path
    - navigation.top
    - search.highlight
    - search.suggest
    - search.share
    - content.code.copy
    - content.code.select
    - content.code.annotate

extra_css:
  - styles/brand.css

extra_javascript:
  - styles/transpose.js

plugins:
  - search:
      lang: en
  - tags:
      tags_file: tags.md
  - awesome-pages:
      collapse_single_pages: true
      strict: false

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - admonition
  - pymdownx.details
  - pymdownx.mark
  - pymdownx.keys
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:zensical.extensions.emoji.twemoji
      emoji_generator: !!python/name:zensical.extensions.emoji.to_svg
  - tables
  - footnotes
  - pymdownx.tasklist:
      custom_checkbox: true
  - toc:
      permalink: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/marcusbaw
    - icon: fontawesome/brands/mastodon
      link: https://mastodon.social/@marcus
